# Secret scanning with gitleaks. See .github/CI.md.
# Every run scans the WHOLE history of every branch and tag (fetch-depth: 0), not only the newest commits: the
# repository is small, so a full scan takes seconds, and a cancelled or failed run can never leave commits unscanned.
# gitleaks runs as a pinned, checksum-verified release binary (no third-party action, no licence key, no extra token).
# Findings are printed with --redact, so the log never shows a secret value.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC, in case the default rules gained a pattern

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from that release's gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tgz}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      # .github/gitleaks.toml keeps the default rules and allows two known false positives (see that file).
      # A root .gitleaksignore, if one is ever added, is honoured too.
      - name: Scan the full history (secrets redacted)
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --config .github/gitleaks.toml \
            --redact --no-banner --no-color --verbose \
            --exit-code 1 \
            .
