# Typecheck, tests and the dashboard build for every push and pull request. See .github/CI.md.
# Every command below was run on a clean copy of the sources (fresh npm ci, no website folder beside the repository,
# TZ=UTC) before it was added here, and passed.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run. On main each commit gets its own group (the
# commit SHA), so no run there is cancelled or dropped from the queue and every commit keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install the workspace packages (api, dashboard, packages/*)
        run: npm ci --no-audit --no-fund

      # apps/mobile is not an npm workspace: it has its own lockfile. Its typecheck needs it, and so do the API tests
      # (tests/integration/motionLayer.test.ts renders with the app's own React from apps/mobile/node_modules).
      - name: Install the mobile app's packages
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck api, dashboard and packages/domain
        run: npm run typecheck

      # The command apps/mobile/AGENTS.md gives for the app's typecheck (the app has no typecheck script; its only
      # lint script is `expo lint`, which is not run here).
      - name: Typecheck the mobile app
        working-directory: apps/mobile
        run: npx --no-install tsc --noEmit

      # The @bioptime/api test script, with one test skipped by name: it reads the public website from ../../drive,
      # a folder outside this repository. (The other website test skips itself when that folder is missing.)
      - name: API tests (unit and integration, in-memory SQLite, no fixed ports)
        working-directory: apps/api
        run: node --import tsx --test --test-skip-pattern="website registration sends the code from the link" "tests/**/*.test.ts"

      - name: Build the dashboard
        run: npm run dashboard:build
