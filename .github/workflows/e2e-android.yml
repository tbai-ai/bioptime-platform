# End-to-end tests of the client app on Android emulators, with Maestro (flows in apps/mobile/.maestro). See .github/CI.md.
# One job builds an x86_64 release APK with no server built in; then a phone and a tablet emulator each run every flow
# against a scratch demo API that the same job starts on the runner (fresh database, synthetic seed data, simulated
# payments, stand-in laboratory). The emulator reaches it at http://10.0.2.2:3000.
# This repository is public: the logs and artifacts (screenshots, JUnit report, API log) are public too. Nothing private
# is used: no secret, no tunnel address, no link-relay topic. The seed's demo password is a public value in
# apps/api/src/seed/seed.ts and only ever goes to that scratch API.
name: E2E Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/api/**'
      # the API's own packages (packages/domain) and the workspace lockfile
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/e2e-android.yml'
      - '.github/actions/android-release-apk/**'
      - '.github/scripts/e2e-android-run.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail: a failing command anywhere in a pipeline fails the step
    shell: bash

jobs:
  build:
    name: Build the x86_64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same build as android.yml (same action, same build-time values), for the emulator's ABI only and with no
      # server built in: the flows type the CI API's address under Server, as a tester does.
      - name: Build the release APK for the emulator
        id: build
        uses: ./.github/actions/android-release-apk
        with:
          architectures: x86_64
          # the emulator's address for the runner, where the job starts the demo API (http keeps cleartext on)
          api-base: 'http://10.0.2.2:3000'
          apk-name: bioptime-e2e-x86_64
          summary-title: E2E APK (x86_64, server http://10.0.2.2:3000 built in, signed with this run's throwaway debug key)

      - uses: actions/upload-artifact@v7
        with:
          name: bioptime-e2e-apk
          path: ${{ steps.build.outputs.apk-path }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  maestro:
    name: Maestro (${{ matrix.device }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7
          # Pixel Tablet; pixel_c is the older tablet profile if an image ever lacks this one
          - device: tablet
            profile: pixel_tablet
    env:
      # the Maestro CLI release archive, pinned and checksum-verified (the file the official install script fetches;
      # the sha256 is the digest GitHub lists for maestro.zip on the cli-2.12.1 release)
      MAESTRO_VERSION: 2.12.1
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # a CI emulator draws in software: give Maestro's on-device driver time to start (ms)
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # the udev rule from reactivecircus/android-emulator-runner's README: hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Maestro and the SDK's command-line tools need Java 17 or later
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the workspace packages (api, dashboard, packages/*)
        run: npm ci --no-audit --no-fund

      - name: Start the demo API (open preview, fresh database)
        env:
          BIOPTIME_MODE: demo
          # "Continue without signing in" (demo mode only; apps/api/src/config.ts)
          OPEN_PREVIEW: '1'
          # loopback: the emulator's 10.0.2.2 is the runner's 127.0.0.1
          HOST: 127.0.0.1
          PORT: '3000'
        run: |
          api="$RUNNER_TEMP/e2e-api"
          out="$RUNNER_TEMP/e2e"
          rm -rf "$api" "$out"
          mkdir -p "$api" "$out"
          export DATABASE_PATH="$api/bioptime.sqlite" REPORTS_DIR="$api/reports" ASSETS_DIR="$api/assets" PRIVATE_FILES_DIR="$api/private"
          # the public website and the built portals are not in this repository; the server starts without them
          export WEBSITE_DIR="$api/no-website" DASHBOARD_DIR="$api/no-dashboard"
          # reset-demo deletes that database, migrates it and seeds the demo (apps/api/src/cli.ts). Its summary lists
          # the seed accounts, so it stays out of the uploaded log.
          npm run api:reset-demo > "$api/seed-summary.txt"
          # the server (apps/api/src/server.ts) keeps running in the background for the emulator step; the runner
          # stops it with the job
          nohup npm run api:start > "$out/api.log" 2>&1 &
          echo "demo API starting (pid $!)"

      - name: Wait for /api/health and the open preview
        run: |
          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 -o "$RUNNER_TEMP/e2e/health.json" http://127.0.0.1:3000/api/health 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::the demo API did not answer at http://127.0.0.1:3000/api/health within 3 minutes"
            tail -60 "$RUNNER_TEMP/e2e/api.log" || true
            exit 1
          fi
          cat "$RUNNER_TEMP/e2e/health.json"
          echo
          # the flows need the one-tap preview of the member workspace
          curl -fsS --max-time 5 -o "$RUNNER_TEMP/public-config.json" http://127.0.0.1:3000/api/public/config
          python3 - "$RUNNER_TEMP/public-config.json" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1]))
          if config.get("openPreview") is not True or "member" not in config.get("openPreviewWorkspaces", []):
              print("::error::the demo API does not offer the open preview for the member workspace")
              sys.exit(1)
          print("open preview: " + ", ".join(config["openPreviewWorkspaces"]))
          PY

      - uses: actions/download-artifact@v8
        with:
          name: bioptime-e2e-apk
          path: ${{ runner.temp }}/apk

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          zip="$RUNNER_TEMP/maestro.zip"
          curl -fsSL --retry 3 -o "$zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  ${zip}" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/maestro-dist" "$RUNNER_TEMP/maestro"
          mkdir -p "$RUNNER_TEMP/maestro-dist"
          unzip -q "$zip" -d "$RUNNER_TEMP/maestro-dist"
          bin=$(find "$RUNNER_TEMP/maestro-dist" -maxdepth 3 -type f -path '*/bin/maestro' | head -1)
          if [ -z "$bin" ]; then echo "::error::maestro.zip has no bin/maestro"; exit 1; fi
          # the folder holding bin/ and lib/ becomes $RUNNER_TEMP/maestro
          mv "$(dirname "$(dirname "$bin")")" "$RUNNER_TEMP/maestro"
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      # API level 35: the API 36 image overloaded the runner (Maestro's on-device driver died while reading the screen on
      # the first run). The app (minSdk 24, targetSdk 36) runs the same on 35, and 35 also keeps the tablet's portrait
      # lock. google_apis x86_64 runs natively under KVM. Animations off (the app's reduced-motion path).
      # -feature -Vulkan: with no GPU the emulator's software Vulkan froze the device whenever the app's Home loaded
      # (runs 1-4: 'Device server died', then the device went offline); Android then draws through OpenGL instead.
      - name: Run the flows on the ${{ matrix.device }} emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_APK_DIR: ${{ runner.temp }}/apk
          E2E_OUT: ${{ runner.temp }}/e2e
          E2E_MAESTRO: ${{ runner.temp }}/maestro/bin/maestro
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          # the action runs each line of `script` on its own, so the steps are in one script file
          script: bash .github/scripts/e2e-android-run.sh

      - name: Summarise the flows
        if: always()
        env:
          JUNIT: ${{ runner.temp }}/e2e/junit.xml
          DEVICE: ${{ matrix.device }}
        run: |
          if [ ! -f "$JUNIT" ]; then
            echo "### Maestro (${DEVICE}): no JUnit report (the flows did not run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$JUNIT" "$DEVICE" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print(f"### Maestro ({sys.argv[2]})")
          print("| Flow | Result | Seconds |")
          print("| --- | --- | --- |")
          for case in root.iter("testcase"):
              if case.find("failure") is not None or case.find("error") is not None:
                  result = "failed"
              elif case.find("skipped") is not None:
                  result = "skipped"
              else:
                  result = "passed"
              print(f"| {case.get('name')} | {result} | {case.get('time', '')} |")
          PY

      # screenshots (maestro/takeScreenshot/ and Maestro's own failure captures), junit.xml, api.log, logcat.txt
      - name: Upload the screenshots, the JUnit report and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-${{ matrix.device }}-${{ github.run_number }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
