# Release APK of the client app (a TESTER build signed with a throwaway debug key). See .github/CI.md.
# This repository is public: anyone signed in to GitHub can download the artifact, so nothing private goes into it.
# In particular no link-relay topic is passed (the build action sets the relay variables empty on purpose).
# The build steps live in .github/actions/android-release-apk, which e2e-android.yml shares.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      # the Maestro flows are not part of the app (e2e-android.yml runs them)
      - '!apps/mobile/.maestro/**'
      - '.github/workflows/android.yml'
      - '.github/actions/android-release-apk/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    name: assembleRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Local action from this repository (checked out in the step above).
      - name: Build the release APK
        id: build
        uses: ./.github/actions/android-release-apk
        with:
          # optional repository variable (Settings > Secrets and variables > Actions > Variables); it is compiled
          # into the app, so it is never a secret. Empty: no built-in server (testers enter one under Me > Server).
          api-base: ${{ vars.BIOPTIME_API_BASE }}

      - uses: actions/upload-artifact@v7
        with:
          name: bioptime-android-release-${{ github.run_number }}
          path: ${{ steps.build.outputs.apk-path }}
          if-no-files-found: error
          retention-days: 14
          # a re-run of this job replaces the artifact of the earlier attempt instead of failing on the name
          overwrite: true
